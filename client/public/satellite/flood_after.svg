<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background:#090d16; font-family: 'JetBrains Mono', monospace;">
  <defs>
    <radialGradient id="floodGrad" cx="40%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4"/>
    </radialGradient>
    <pattern id="floodGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#floodGrid)" />

  <!-- Base Landmass -->
  <path d="M 0,0 L 450,0 Q 420,150 440,250 Q 460,350 430,400 L 0,400 Z" fill="#152238" stroke="#1e3a5f" stroke-width="1.5" />

  <!-- Massive Flood Inundation Polygon (11.7 km²) -->
  <path d="M 0,100 Q 80,60 180,90 Q 280,120 340,160 Q 420,180 440,260 Q 450,340 380,380 Q 240,400 120,380 Q 0,350 0,260 Z" fill="url(#floodGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Submerged Roads (Red alert dashed lines) -->
  <path d="M 40,40 L 400,40" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 80,100 L 340,160" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,2"/>
  <path d="M 40,300 L 380,300" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,2"/>
  <path d="M 200,20 L 200,380" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,2"/>

  <!-- Submerged Settlement Clusters with Alert Indicators -->
  <rect x="80" y="60" width="45" height="30" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="140" y="60" width="50" height="30" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="165" cy="75" r="4" fill="#ef4444"/>
  <rect x="90" y="240" width="60" height="40" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="120" cy="260" r="4" fill="#ef4444"/>
  <rect x="250" y="250" width="70" height="45" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="285" cy="272" r="4" fill="#ef4444"/>

  <!-- Ocean / Coastal Water -->
  <path d="M 450,0 Q 420,150 440,250 Q 460,350 430,400 L 600,400 L 600,0 Z" fill="#0369a1" opacity="0.9" />

  <!-- Telemetry Overlay Badges -->
  <rect x="16" y="16" width="260" height="66" rx="6" fill="#0b1120" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.2"/>
  <text x="28" y="36" fill="#f87171" font-size="10" letter-spacing="1">POST-DISASTER OBSERVATION (T+6H)</text>
  <text x="28" y="56" fill="#ffffff" font-size="15" font-weight="700">Water Extent: 11.7 km²</text>
  <text x="28" y="72" fill="#ef4444" font-size="12" font-weight="700">▲ EXPANSION: +265.6% (CRITICAL)</text>

  <rect x="380" y="330" width="204" height="54" rx="6" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <text x="392" y="348" fill="#94a3b8" font-size="9">SENSOR: Sentinel-1 SAR (IW)</text>
  <text x="392" y="362" fill="#38bdf8" font-size="10">dB Drop: -6.8 dB (Specular)</text>
  <text x="392" y="376" fill="#ef4444" font-size="10" font-weight="700">● 64% Street Grids Submerged</text>
</svg>
