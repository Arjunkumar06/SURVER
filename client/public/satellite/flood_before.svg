<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background:#090d16; font-family: 'JetBrains Mono', monospace;">
  <defs>
    <radialGradient id="oceanGrad" cx="90%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.4"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Grid overlay -->
  <rect width="600" height="400" fill="url(#grid)" />

  <!-- Urban Landmass (Dark slate/green tone) -->
  <path d="M 0,0 L 450,0 Q 420,150 440,250 Q 460,350 430,400 L 0,400 Z" fill="#152238" stroke="#1e3a5f" stroke-width="1.5" />

  <!-- Baseline River / Normal Water Body (3.2 km²) -->
  <path d="M 0,180 Q 180,190 280,210 T 440,230" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M 120,0 Q 150,100 200,185" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.7"/>

  <!-- Ocean / Coastal Water -->
  <path d="M 450,0 Q 420,150 440,250 Q 460,350 430,400 L 600,400 L 600,0 Z" fill="url(#oceanGrad)" />

  <!-- Urban Roads -->
  <path d="M 40,40 L 400,40 M 80,100 L 380,100 M 40,300 L 390,300 M 200,20 L 200,380 M 320,20 L 320,380" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Settlement Clusters -->
  <rect x="80" y="60" width="45" height="30" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="140" y="60" width="50" height="30" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="90" y="240" width="60" height="40" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="250" y="250" width="70" height="45" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>

  <!-- Badges and Telemetry -->
  <rect x="16" y="16" width="220" height="52" rx="6" fill="#0b1120" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="36" fill="#94a3b8" font-size="10" letter-spacing="1">PRE-DISASTER BASELINE (T-0)</text>
  <text x="28" y="54" fill="#38bdf8" font-size="14" font-weight="700">Water Extent: 3.2 km²</text>

  <rect x="420" y="340" width="164" height="44" rx="6" fill="#0b1120" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="432" y="358" fill="#64748b" font-size="9">SENSOR: Sentinel-1 C-SAR</text>
  <text x="432" y="372" fill="#10b981" font-size="11" font-weight="600">● Normal Hydrology</text>
</svg>
